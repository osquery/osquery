{
  "queries": {
    "authorized_ssh_keys": {
      "query": "select username, algorithm, options, comment, key_file from users join authorized_keys using (uid);",
      "interval": "3600",
      "platform": "linux",
      "version": "1.0.0",
      "description": "Retrieves SSH public keys configured for local Linux users.",
      "value": "Provides context for investigating unexpected SSH access and changes to authorized_keys."
    },
    "authorized_keys_with_options": {
      "query": "select username, algorithm, options, comment, key_file from users join authorized_keys using (uid) where options != '';",
      "interval": "3600",
      "platform": "linux",
      "version": "1.0.0",
      "description": "Retrieves authorized SSH keys that specify additional login options.",
      "value": "Provides additional context for investigating SSH keys that use forced commands, forwarding, or other key-specific options."
    },
    "unencrypted_private_ssh_keys": {
      "query": "select username, path, key_type, key_length, key_security_bits from users join user_ssh_keys using (uid) where encrypted = 0;",
      "interval": "3600",
      "platform": "linux",
      "version": "1.0.0",
      "description": "Retrieves unencrypted private SSH keys found in local users' SSH directories.",
      "value": "Provides context for investigating unencrypted private SSH keys during credential exposure or incident response."
    },
    "ssh_client_configuration": {
      "query": "select username, block, option, ssh_config_file from users join ssh_configs using (uid);",
      "interval": "3600",
      "platform": "linux",
      "version": "1.0.0",
      "description": "Retrieves parsed SSH client configuration for local users.",
      "value": "Provides SSH configuration context when investigating unexpected SSH connections or configuration changes."
    }
  }
}
