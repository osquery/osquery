syntax = "proto3";

package containerd.services.tasks.v1;

import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/containerd/containerd/api/services/tasks/v1;tasks";

service Tasks {
  rpc Create(CreateTaskRequest) returns (CreateTaskResponse);
  rpc Start(StartRequest) returns (StartResponse);
  rpc Delete(DeleteTaskRequest) returns (DeleteResponse);
  rpc DeleteProcess(DeleteProcessRequest) returns (DeleteResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc List(ListTasksRequest) returns (ListTasksResponse);
  rpc Kill(KillRequest) returns (google.protobuf.Empty);
  rpc Exec(ExecProcessRequest) returns (google.protobuf.Empty);
  rpc ResizePty(ResizePtyRequest) returns (google.protobuf.Empty);
  rpc CloseIO(CloseIORequest) returns (google.protobuf.Empty);
  rpc Pause(PauseTaskRequest) returns (google.protobuf.Empty);
  rpc Resume(ResumeTaskRequest) returns (google.protobuf.Empty);
  rpc ListPids(ListPidsRequest) returns (ListPidsResponse);
  rpc Checkpoint(CheckpointTaskRequest) returns (CheckpointTaskResponse);
  rpc Update(UpdateTaskRequest) returns (google.protobuf.Empty);
  rpc Metrics(MetricsRequest) returns (MetricsResponse);
  rpc Wait(WaitRequest) returns (WaitResponse);
}

message CreateTaskRequest {
  string container_id = 1;
  repeated Mount rootfs = 3;
  string stdin = 4;
  string stdout = 5;
  string stderr = 6;
  bool terminal = 7;
  Checkpoint checkpoint = 8;
  google.protobuf.Any options = 9;
}

message CreateTaskResponse {
  string container_id = 1;
  uint32 pid = 2;
}

message StartRequest {
  string container_id = 1;
  string exec_id = 2;
}

message StartResponse {
  uint32 pid = 1;
}

message DeleteTaskRequest {
  string container_id = 1;
}

message DeleteResponse {
  string id = 1;
  uint32 pid = 2;
  uint32 exit_status = 3;
  google.protobuf.Timestamp exited_at = 4;
}

message DeleteProcessRequest {
  string container_id = 1;
  string exec_id = 2;
}

message GetRequest {
  string container_id = 1;
  string exec_id = 2;
}

message GetResponse {
  Process process = 1;
}

message ListTasksRequest {
  string filter = 1;
}

message ListTasksResponse {
  repeated Process tasks = 1;
}

message KillRequest {
  string container_id = 1;
  string exec_id = 2;
  uint32 signal = 3;
  bool all = 4;
}

message ExecProcessRequest {
  string container_id = 1;
  string stdin = 2;
  string stdout = 3;
  string stderr = 4;
  bool terminal = 5;
  google.protobuf.Any spec = 6;
  string exec_id = 7;
}

message ExecProcessResponse {}

message ResizePtyRequest {
  string container_id = 1;
  string exec_id = 2;
  uint32 width = 3;
  uint32 height = 4;
}

message CloseIORequest {
  string container_id = 1;
  string exec_id = 2;
  bool stdin = 3;
}

message PauseTaskRequest {
  string container_id = 1;
}

message ResumeTaskRequest {
  string container_id = 1;
}

message ListPidsRequest {
  string container_id = 1;
}

message ListPidsResponse {
  repeated ProcessInfo processes = 1;
}

message CheckpointTaskRequest {
  string container_id = 1;
  string parent_checkpoint = 2;
  google.protobuf.Any options = 3;
}

message CheckpointTaskResponse {
  repeated Descriptor descriptors = 1;
}

message UpdateTaskRequest {
  string container_id = 1;
  google.protobuf.Any resources = 2;
}

message MetricsRequest {
  repeated string filters = 1;
}

message MetricsResponse {
  repeated Metric metrics = 1;
}

message WaitRequest {
  string container_id = 1;
  string exec_id = 2;
}

message WaitResponse {
  uint32 exit_status = 1;
  google.protobuf.Timestamp exited_at = 2;
}

// Process is a running process in a container
message Process {
  string container_id = 1;
  string id = 2;
  uint32 pid = 3;
  Status status = 4;
  string stdin = 5;
  string stdout = 6;
  string stderr = 7;
  bool terminal = 8;
  uint32 exit_status = 9;
  google.protobuf.Timestamp exited_at = 10;
}

enum Status {
  UNKNOWN = 0;
  CREATED = 1;
  RUNNING = 2;
  STOPPED = 3;
  PAUSED = 4;
  PAUSING = 5;
}

message ProcessInfo {
  uint32 pid = 1;
  google.protobuf.Any info = 2;
}

message Mount {
  string type = 1;
  string source = 2;
  string target = 3;
  repeated string options = 4;
}

message Checkpoint {
  string name = 1;
  string parent_checkpoint = 2;
  google.protobuf.Any options = 3;
}

message Descriptor {
  string media_type = 1;
  string digest = 2;
  int64 size = 3;
  map<string, string> annotations = 5;
}

message Metric {
  google.protobuf.Timestamp timestamp = 1;
  string id = 2;
  google.protobuf.Any data = 3;
}
