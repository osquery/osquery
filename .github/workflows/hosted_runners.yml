# Due to a limitation in how GitHub Actions works, we can't reference
# jobs in another file inside the `needs` statement.
#
# This configuration file takes care of the Windows, macOS and Linux
# builds on x86_64 and aarch64
name: build

on:
  # Run this workflow once every day against the master branch
  schedule:
   - cron: "0 7 * * *"

  push:
    branches:
      - 'master'
      - 'main'

    tags:
      - '*'

  pull_request:
    branches:
      - '*'

# Cancel old jobs of a PR if a new job is started.
# Fallback on using the run id if it's not a PR, which is unique, so no job canceling.
concurrency:
  group: hosted-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Please remember to update values for both x86 and aarch64 workflows.
env:
  PACKAGING_REPO: https://github.com/osquery/osquery-packaging
  PACKAGING_COMMIT: 528b57ae758f41f0aaafde25bf2d3844785dd848
  OSQUERY_TOOLCHAIN_VERSION: 1.2.0

# If the initial code sanity checks are passing, then one job
# per [`platform` * `build_type`] will start, building osquery
# and generating packages that are later attached to the commit
# (or PR) as build artifacts.
jobs:
  # This job performs basic source code check, looking for formatting
  # issues and missing copyright headers
  check_code_style:
    runs-on: ubuntu-22.04

    steps:
    - name: Install osquery-toolchain
      run: |
        wget https://github.com/osquery/osquery-toolchain/releases/download/${{ env.OSQUERY_TOOLCHAIN_VERSION }}/osquery-toolchain-${{ env.OSQUERY_TOOLCHAIN_VERSION }}-$(uname -m).tar.xz 
        sudo tar xvf osquery-toolchain-${{ env.OSQUERY_TOOLCHAIN_VERSION }}-$(uname -m).tar.xz -C /usr/local

    - name: Setup the build paths
      shell: bash
      id: build_paths
      run: |
        rel_build_path="workspace/build"
        rel_source_path="workspace/src"

        mkdir -p "${rel_build_path}"
        mkdir -p "${rel_source_path}"

        echo "SOURCE=$(realpath ${rel_source_path})" >> $GITHUB_OUTPUT
        echo "BINARY=$(realpath ${rel_build_path})" >> $GITHUB_OUTPUT

    - name: Clone the osquery repository
      uses: actions/checkout@v7
      with:
        path: ${{ steps.build_paths.outputs.SOURCE }}
        fetch-depth: 0

    # This script makes sure that the copyright headers have been correctly
    # placed on all the source code files
    - name: Check the copyright headers
      working-directory: ${{ steps.build_paths.outputs.SOURCE }}
      run: ./tools/ci/scripts/check_copyright_headers.py

    - name: Configure the project
      working-directory: ${{ steps.build_paths.outputs.BINARY }}
      run: |
        cmake -G "Unix Makefiles" \
          -DOSQUERY_TOOLCHAIN_SYSROOT:PATH="/usr/local/osquery-toolchain" \
          -DOSQUERY_ENABLE_FORMAT_ONLY=ON \
          "${{ steps.build_paths.outputs.SOURCE }}"

    # Formatting is tested against the clang-format binary we ship
    # with the osquery-toolchain, so this job is only performed once on
    # a Linux machine.
    - name: Check code formatting
      working-directory: ${{ steps.build_paths.outputs.BINARY }}
      run: cmake --build . --target format_check


  # This jobs checks that the third party libraries manifest has the correct format
  # and that is up to date compared to the current state of the repository
  check_libraries_manifest:
    runs-on: ubuntu-22.04

    steps:
    - name: Clone the osquery repository
      uses: actions/checkout@v7

    - name: Install python pre-requisites
      run: pip3 install -r ./tools/ci/scripts/cve/requirements.txt

    - name: Verify the third party libraries manifest
      run: |
        ./tools/ci/scripts/cve/validate_manifest_libraries_versions.py --manifest libraries/third_party_libraries_manifest.json \
        --repository .


  # Test generating the website json
  check_genwebsitejson:
    needs: [check_code_style, check_libraries_manifest]
    runs-on: ubuntu-22.04

    steps:
    - name: Clone the osquery repository
      uses: actions/checkout@v7

    - name: genwebsitejson.py
      run: python3 tools/codegen/genwebsitejson.py --specs=specs/


  cppcheck_linux:
    needs: [check_code_style, check_libraries_manifest]
    runs-on: ubuntu-26.04
    steps:
    - name: Install osquery-toolchain
      run: |
        wget https://github.com/osquery/osquery-toolchain/releases/download/${{ env.OSQUERY_TOOLCHAIN_VERSION }}/osquery-toolchain-${{ env.OSQUERY_TOOLCHAIN_VERSION }}-$(uname -m).tar.xz 
        sudo tar xvf osquery-toolchain-${{ env.OSQUERY_TOOLCHAIN_VERSION }}-$(uname -m).tar.xz -C /usr/local

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y cppcheck

    - name: Setup the build paths
      shell: bash
      id: build_paths
      run: |
        rel_build_path="workspace/build"
        rel_source_path="workspace/src"
        rel_install_path="workspace/install"

        mkdir -p ${rel_build_path} \
                 ${rel_source_path} \
                 ${rel_install_path}

        echo "SOURCE=$(realpath ${rel_source_path})" >> $GITHUB_OUTPUT
        echo "BINARY=$(realpath ${rel_build_path})" >> $GITHUB_OUTPUT
        echo "REL_BINARY=${rel_build_path}" >> $GITHUB_OUTPUT

    - name: Clone the osquery repository
      uses: actions/checkout@v7
      with:
        path: ${{ steps.build_paths.outputs.SOURCE }}
        fetch-depth: 0

    - name: Compute the submodule hash
      id: submodule_hash
      shell: bash
      run: echo "VALUE=$(git -C ${{ steps.build_paths.outputs.SOURCE }} submodule status --recursive | sha256sum | awk '{print $1}')" >> $GITHUB_OUTPUT

    - name: Restore cache (git submodules)
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.build_paths.outputs.SOURCE }}/.git/modules
        key: gitmodules_${{ runner.os }}_${{ steps.submodule_hash.outputs.VALUE }}
        restore-keys: gitmodules_${{ runner.os }}

    - name: Update the git submodules
      working-directory: ${{ steps.build_paths.outputs.SOURCE }}
      run: git submodule sync --recursive

    - name: Configure the project (Release)
      working-directory: ${{ steps.build_paths.outputs.BINARY }}
      run: |
        cmake -G "Unix Makefiles" \
          -DOSQUERY_TOOLCHAIN_SYSROOT:PATH="/usr/local/osquery-toolchain" \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
          -DOSQUERY_BUILD_TESTS=ON \
          -DOSQUERY_BUILD_ROOT_TESTS=ON \
          "${{ steps.build_paths.outputs.SOURCE }}"

    - name: Initialize the project (Release)
      working-directory: ${{ steps.build_paths.outputs.BINARY }}
      run: cmake --build . --target prepare_for_ide

    - name: Run cppcheck (Release)
      shell: bash
      id: release_cppcheck_runner
      working-directory: ${{ steps.build_paths.outputs.BINARY }}
      run: |
        # Create generated source files (if not exist) to avoid cppcheck errors
        touch ${{ steps.build_paths.outputs.BINARY }}/osquery/empty_osqueryd_target_source_file.cpp
        touch ${{ steps.build_paths.outputs.BINARY }}/specs/amalgamated_native_tables.cpp
        touch ${{ steps.build_paths.outputs.BINARY }}/specs/amalgamated_foreign_tables.cpp
        cmake --build . --target cppcheck 2>&1 | tee cppcheck_release.txt

    - name: Store the cppcheck log (Release)
      uses: actions/upload-artifact@v7
      with:
        name: cppcheck-release
        path: ${{ steps.build_paths.outputs.REL_BINARY }}/cppcheck_release.txt

    - name: Configure the project (Debug)
      working-directory: ${{ steps.build_paths.outputs.BINARY }}

      run: |
        cmake -G "Unix Makefiles" \
          -DOSQUERY_TOOLCHAIN_SYSROOT:PATH="/usr/local/osquery-toolchain" \
          -DCMAKE_BUILD_TYPE:STRING=Debug \
          -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
          -DOSQUERY_BUILD_TESTS=ON \
          -DOSQUERY_BUILD_ROOT_TESTS=ON \
          "${{ steps.build_paths.outputs.SOURCE }}"

    - name: Initialize the project (Debug)
      working-directory: ${{ steps.build_paths.outputs.BINARY }}
      run: cmake --build . --target prepare_for_ide

    - name: Run cppcheck (Debug)
      shell: bash
      id: debug_cppcheck_runner
      working-directory: ${{ steps.build_paths.outputs.BINARY }}
      run: cmake --build . --target cppcheck 2>&1 | tee cppcheck_debug.txt

    - name: Store the cppcheck log (Debug)
      uses: actions/upload-artifact@v7
      with:
        name: cppcheck-debug
        path: ${{ steps.build_paths.outputs.REL_BINARY }}/cppcheck_debug.txt

    - name: Annotate unique cppcheck findings
      working-directory: ${{ steps.build_paths.outputs.BINARY }}
      run: |
        echo "::add-matcher::${{ steps.build_paths.outputs.SOURCE }}/.github/cppcheck-matcher.json"
        LC_ALL=C sort -u cppcheck_release.txt cppcheck_debug.txt

    - name: Save cache (git submodules)
      if: github.ref_name == github.event.repository.default_branch
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.build_paths.outputs.SOURCE }}/.git/modules
        key: gitmodules_${{ runner.os }}_${{ steps.submodule_hash.outputs.VALUE }}


  cppcheck_macos:
    needs: [check_code_style, check_libraries_manifest]
    runs-on: macos-26

    steps:
    - name: Setup the build paths
      id: build_paths
      shell: bash
      run: |
        rel_build_path="workspace/build"
        rel_source_path="workspace/src"

        mkdir -p "${rel_build_path}" "${rel_source_path}"

        echo "SOURCE=$(pwd)/${rel_source_path}" >> $GITHUB_OUTPUT
        echo "BINARY=$(pwd)/${rel_build_path}" >> $GITHUB_OUTPUT
        echo "REL_SOURCE=${rel_source_path}" >> $GITHUB_OUTPUT
        echo "REL_BINARY=${rel_build_path}" >> $GITHUB_OUTPUT

    - name: Clone the osquery repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        path: ${{ steps.build_paths.outputs.REL_SOURCE }}

    - name: Compute the submodule hash
      id: submodule_hash
      shell: bash
      run: echo "VALUE=$(git -C ${{ steps.build_paths.outputs.SOURCE }} submodule status --recursive | shasum -a 256 | awk '{print $1}')" >> $GITHUB_OUTPUT

    - name: Restore cache (git submodules)
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.build_paths.outputs.SOURCE }}/.git/modules
        key: gitmodules_${{ runner.os }}_${{ steps.submodule_hash.outputs.VALUE }}
        restore-keys: gitmodules_${{ runner.os }}

    - name: Install build dependencies
      run: |
        brew install \
          bison \
          coreutils \
          cppcheck \
          flex \
          gnu-sed

    - name: Update the git submodules
      working-directory: ${{ steps.build_paths.outputs.SOURCE }}
      run: git submodule sync --recursive

    - name: Configure the project
      working-directory: ${{ steps.build_paths.outputs.BINARY }}
      run: |
        cmake -G "Unix Makefiles" \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
          -DOSQUERY_BUILD_TESTS=ON \
          -DOSQUERY_BUILD_ROOT_TESTS=ON \
          "${{ steps.build_paths.outputs.SOURCE }}"

    - name: Initialize the project
      working-directory: ${{ steps.build_paths.outputs.BINARY }}
      run: cmake --build . --target prepare_for_ide

    - name: Create generated source files
      working-directory: ${{ steps.build_paths.outputs.BINARY }}
      run: |
        touch osquery/empty_osqueryd_target_source_file.cpp
        touch specs/amalgamated_native_tables.cpp
        touch specs/amalgamated_foreign_tables.cpp

    - name: Enable cppcheck annotations
      run: echo "::add-matcher::${{ steps.build_paths.outputs.SOURCE }}/.github/cppcheck-matcher.json"

    - name: Run cppcheck
      working-directory: ${{ steps.build_paths.outputs.BINARY }}
      run: cmake --build . --target cppcheck 2>&1 | tee cppcheck_macos.txt

    - name: Store the cppcheck log
      uses: actions/upload-artifact@v7
      with:
        name: cppcheck-macos
        path: ${{ steps.build_paths.outputs.REL_BINARY }}/cppcheck_macos.txt

    - name: Save cache (git submodules)
      if: github.ref_name == github.event.repository.default_branch
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.build_paths.outputs.SOURCE }}/.git/modules
        key: gitmodules_${{ runner.os }}_${{ steps.submodule_hash.outputs.VALUE }}


  cppcheck_windows:
    needs: [check_code_style, check_libraries_manifest]
    runs-on: windows-2022

    steps:
    - name: Configure git
      run: |
        git config --global core.autocrlf false
        git config --global core.symlinks true

    - name: Setup the build paths
      id: build_paths
      shell: powershell
      run: |
        $rel_src_path = "w\src"
        $rel_build_path = "w\build"
        $rel_downloads_path = "w\downloads"
        $rel_install_path = "w\install"

        New-Item -ItemType Directory -Force -Path $rel_build_path
        New-Item -ItemType Directory -Force -Path $rel_downloads_path
        New-Item -ItemType Directory -Force -Path $rel_install_path

        $base_dir = (Get-Item .).FullName
        echo "SOURCE=$base_dir\$rel_src_path" >> $env:GITHUB_OUTPUT
        echo "REL_SOURCE=$($rel_src_path -replace '\\', '/')" >> $env:GITHUB_OUTPUT
        echo "BINARY=$base_dir\$rel_build_path" >> $env:GITHUB_OUTPUT
        echo "REL_BINARY=$($rel_build_path -replace '\\', '/')" >> $env:GITHUB_OUTPUT
        echo "DOWNLOADS=$base_dir\$rel_downloads_path" >> $env:GITHUB_OUTPUT
        echo "INSTALL=$base_dir\$rel_install_path" >> $env:GITHUB_OUTPUT

    - name: Clone the osquery repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        path: ${{ steps.build_paths.outputs.REL_SOURCE }}

    - name: Compute the submodule hash
      id: submodule_hash
      shell: powershell
      run: |
        $inputStr = (git -C "${{ steps.build_paths.outputs.SOURCE }}" submodule status --recursive) -join "`n"
        $bytes = [System.Text.Encoding]::UTF8.GetBytes($inputStr)
        $sha256 = [System.Security.Cryptography.SHA256]::Create()
        $hash = [BitConverter]::ToString($sha256.ComputeHash($bytes)).Replace("-", "").ToLower()
        echo "VALUE=$hash" >> $env:GITHUB_OUTPUT

    - name: Restore cache (git submodules)
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.build_paths.outputs.SOURCE }}\.git\modules
        key: gitmodules_${{ runner.os }}_${{ steps.submodule_hash.outputs.VALUE }}
        restore-keys: gitmodules_${{ runner.os }}

    - name: Install Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13.x"
        architecture: x64

    - name: Locate the Python root directory
      id: python_root_directory
      shell: powershell
      run: |
        $python_executable_path = (Get-Command python.exe).Definition
        $python_root_directory = (Get-Item $python_executable_path).Directory.FullName
        echo "VALUE=$python_root_directory" >> $env:GITHUB_OUTPUT

    - name: Install cppcheck
      shell: powershell
      run: choco install cppcheck --no-progress --yes

    - name: Locate cppcheck
      id: cppcheck
      shell: powershell
      run: |
        $cppcheck = Join-Path $env:ProgramFiles "Cppcheck\cppcheck.exe"
        if (-not (Test-Path -LiteralPath $cppcheck -PathType Leaf)) {
          throw "cppcheck.exe was not installed at $cppcheck"
        }
        & $cppcheck --version
        echo "VALUE=$cppcheck" >> $env:GITHUB_OUTPUT

    - name: Install Ninja
      working-directory: ${{ steps.build_paths.outputs.DOWNLOADS }}
      shell: powershell
      run: |
        $version = "1.10.0"
        $archive_name = "ninja-win.zip"
        $url = "https://github.com/ninja-build/ninja/releases/download/v$version/$archive_name"

        (New-Object System.Net.WebClient).DownloadFile($url, $archive_name)
        7z x -o${{ steps.build_paths.outputs.INSTALL }}\ninja -y $archive_name
        echo "${{ steps.build_paths.outputs.INSTALL }}\ninja" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Configure the project
      shell: cmd
      working-directory: ${{ steps.build_paths.outputs.BINARY }}
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
        @echo on

        cmake -G Ninja ^
          -DCMAKE_C_COMPILER=cl.exe ^
          -DCMAKE_CXX_COMPILER=cl.exe ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON ^
          -DCPPCHECK_EXECUTABLE:FILEPATH="${{ steps.cppcheck.outputs.VALUE }}" ^
          -DOSQUERY_BUILD_TESTS=ON ^
          -DPython3_ROOT_DIR="${{ steps.python_root_directory.outputs.VALUE }}" ^
          "${{ steps.build_paths.outputs.SOURCE }}"

    - name: Initialize the project
      working-directory: ${{ steps.build_paths.outputs.BINARY }}
      run: cmake --build . --target prepare_for_ide

    - name: Create generated source files
      working-directory: ${{ steps.build_paths.outputs.BINARY }}
      shell: powershell
      run: |
        New-Item -ItemType File -Force -Path osquery/empty_osqueryd_target_source_file.cpp
        New-Item -ItemType File -Force -Path specs/amalgamated_native_tables.cpp
        New-Item -ItemType File -Force -Path specs/amalgamated_foreign_tables.cpp

    - name: Enable cppcheck annotations
      shell: powershell
      run: |
        $matcher = Join-Path ${{ steps.build_paths.outputs.SOURCE }} ".github/cppcheck-matcher.json"
        Write-Output "::add-matcher::$matcher"

    - name: Run cppcheck
      working-directory: ${{ steps.build_paths.outputs.BINARY }}
      shell: powershell
      run: cmake --build . --target cppcheck 2>&1 | Tee-Object -FilePath cppcheck_windows.txt

    - name: Store the cppcheck log
      uses: actions/upload-artifact@v7
      with:
        name: cppcheck-windows
        path: ${{ steps.build_paths.outputs.REL_BINARY }}/cppcheck_windows.txt

    - name: Save cache (git submodules)
      if: github.ref_name == github.event.repository.default_branch
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.build_paths.outputs.SOURCE }}\.git\modules
        key: gitmodules_${{ runner.os }}_${{ steps.submodule_hash.outputs.VALUE }}


  compiler_cache_lookup:
    runs-on: ubuntu-22.04
    permissions:
      actions: read
    outputs:
      caches: ${{ steps.lookup.outputs.result || '{}' }}

    steps:
    - name: Find compiler cache artifacts from default-branch runs
      id: lookup
      # We don't use caches on tags -- we do full clean builds.
      # When this step doesn't run, later steps will not try to use the cache.
      if: github.ref_type != 'tag'
      continue-on-error: true
      uses: actions/github-script@v8
      with:
        script: |
          const caches = {};
          const branch = context.payload.repository.default_branch;
          const repository = `${context.repo.owner}/${context.repo.repo}`;
          const cutoff = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
          const pages = github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
            ...context.repo,
            workflow_id: 'hosted_runners.yml',
            branch,
            status: 'success',
            created: `>=${cutoff}`,
            per_page: 100,
          });

          for await (const page of pages) {
            for (const run of page.data) {
              if (!['push', 'schedule'].includes(run.event) ||
                  run.head_branch !== branch ||
                  run.head_repository?.full_name !== repository ||
                  run.id === context.runId) {
                continue;
              }

              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo,
                run_id: run.id,
                per_page: 100,
              });
              for (const artifact of artifacts) {
                if (!artifact.expired && artifact.name.startsWith('compiler-cache-v1-') &&
                    !Object.hasOwn(caches, artifact.name)) {
                  caches[artifact.name] = run.id;
                }
              }
            }
          }

          core.info(`Compiler cache sources: ${JSON.stringify(caches)}`);
          return caches;